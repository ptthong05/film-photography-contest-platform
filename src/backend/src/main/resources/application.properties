# Server Configuration
server.port=8081

# Application Name
spring.application.name=backend-api

# MongoDB Configuration
# Set MONGODB_URI for MongoDB Atlas or a non-local MongoDB server.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/film_photography_contest_management_db}
spring.data.mongodb.auto-index-creation=true

# CORS - danh sách origin frontend, phân cách bằng dấu phẩy
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# MySQL Configuration (TV2 - Cổng 3307 khớp với Docker container filmcontest-mysql)
spring.datasource.url=jdbc:mysql://localhost:3307/film_contest_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect