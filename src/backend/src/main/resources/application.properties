# Server Configuration
server.port=8081

# Application Name
spring.application.name=backend-api

# MySQL Configuration
# Set MYSQL_URL, MYSQL_USER, MYSQL_PASSWORD environment variables for non-local environments.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3308/film_photography_contest_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# CORS - danh sách origin frontend, phân cách bằng dấu phẩy
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f4c8b2d0e9f1a3c5b7d9e2f4a6b8c0d1e3f5a7b9c1d3e5f7a}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
