# Server Configuration
server.port=8081

# Application Name
spring.application.name=backend-api

# MongoDB Configuration
# Set MONGODB_URI for MongoDB Atlas or a non-local MongoDB server.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/film_photography_contest_management_db}
spring.data.mongodb.auto-index-creation=true

# CORS - danh sách origin frontend, phân cách bằng dấu phẩy
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Existing Mongo-only startup stays compatible unless profile tv3 is selected.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
