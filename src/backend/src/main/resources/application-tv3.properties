spring.autoconfigure.exclude=
spring.datasource.url=${TV3_MYSQL_URL:jdbc:mysql://localhost:3307/filmcontest_tv3?connectionTimeZone=UTC}
spring.datasource.username=${TV3_MYSQL_USER}
spring.datasource.password=${TV3_MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/tv3
spring.flyway.table=flyway_tv3_history
spring.flyway.clean-disabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=42MB
tv3.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
tv3.cloudinary.api-key=${CLOUDINARY_API_KEY:}
tv3.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Preserve the existing Mongo user module without requiring an index operation at TV3 startup.
spring.data.mongodb.auto-index-creation=false
