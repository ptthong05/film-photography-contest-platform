name: filmcontest-tv3
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: filmcontest_tv3
      MYSQL_USER: ${TV3_MYSQL_USER:?set TV3_MYSQL_USER}
      MYSQL_PASSWORD: ${TV3_MYSQL_PASSWORD:?set TV3_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${TV3_MYSQL_ROOT_PASSWORD:?set TV3_MYSQL_ROOT_PASSWORD}
    volumes:
      - tv3_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  tv3_mysql_data:
